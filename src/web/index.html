<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antigravity Subagent Monitor</title>
  <style>
    :root {
      --bg-base: #0a0e17;
      --bg-surface: #111827;
      --bg-surface-hover: #172236;
      --bg-card: #151f32;
      --border-subtle: #1e293b;
      --border-focus: #38bdf8;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --cyan: #38bdf8;
      --cyan-dim: rgba(56, 189, 248, 0.12);
      --green: #10b981;
      --green-dim: rgba(16, 185, 129, 0.15);
      --yellow: #f59e0b;
      --yellow-dim: rgba(245, 158, 11, 0.15);
      --red: #f43f5e;
      --red-dim: rgba(244, 63, 94, 0.15);
      --purple: #a855f7;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-sans);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* 顶部导航状态栏 */
    header {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-logo {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #0ea5e9, #a855f7);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #fff;
      font-size: 15px;
      box-shadow: 0 0 12px rgba(14, 165, 233, 0.4);
    }
    .brand-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #fff;
    }
    .brand-badge {
      background: var(--cyan-dim);
      color: var(--cyan);
      font-size: 11px;
      font-family: var(--font-mono);
      padding: 2px 8px;
      border-radius: 12px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .header-status {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 13px;
    }
    .live-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      background: var(--green-dim);
      color: var(--green);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .live-dot {
      width: 8px;
      height: 8px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--green);
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* 主布局 */
    .app-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 57px);
      overflow: hidden;
    }

    /* 左侧任务列表栏 */
    .sidebar {
      width: 320px;
      background-color: var(--bg-surface);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sidebar-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
    }
    .task-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .task-item {
      padding: 12px;
      border-radius: 8px;
      background-color: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      margin-bottom: 6px;
      transition: all 0.15s ease;
    }
    .task-item:hover {
      background-color: var(--bg-surface-hover);
      border-color: var(--border-subtle);
    }
    .task-item.active {
      background-color: var(--bg-card);
      border-color: var(--cyan);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.1);
    }
    .task-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 12px;
    }
    .status-tag {
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .status-running { background: var(--cyan-dim); color: var(--cyan); border: 1px solid rgba(56, 189, 248, 0.3); }
    .status-completed, .status-success { background: var(--green-dim); color: var(--green); border: 1px solid rgba(16, 185, 129, 0.3); }
    .status-queued { background: var(--yellow-dim); color: var(--yellow); border: 1px solid rgba(245, 158, 11, 0.3); }
    .status-cancelled { background: rgba(148, 163, 184, 0.1); color: var(--text-muted); border: 1px solid rgba(148, 163, 184, 0.2); }
    .status-error, .status-interrupted { background: var(--red-dim); color: var(--red); border: 1px solid rgba(244, 63, 94, 0.3); }

    .task-prompt-preview {
      font-size: 13px;
      color: var(--text-main);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.4;
      margin-bottom: 6px;
    }
    .task-sub-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-dim);
      font-family: var(--font-mono);
    }

    /* 右侧监控区 */
    .main-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      background-color: var(--bg-base);
    }
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      gap: 12px;
    }

    /* 任务详情头部 */
    .job-banner {
      background: linear-gradient(180deg, var(--bg-surface) 0%, rgba(17, 24, 39, 0.6) 100%);
      border-bottom: 1px solid var(--border-subtle);
      padding: 20px 28px;
    }
    .job-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 12px;
    }
    .job-prompt {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      line-height: 1.5;
    }
    .job-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    .btn {
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
      border: 1px solid transparent;
    }
    .btn-danger {
      background-color: var(--red-dim);
      color: var(--red);
      border-color: rgba(244, 63, 94, 0.3);
    }
    .btn-danger:hover {
      background-color: var(--red);
      color: #fff;
    }
    .btn-secondary {
      background-color: var(--bg-card);
      color: var(--text-muted);
      border-color: var(--border-subtle);
    }
    .btn-secondary:hover {
      color: var(--text-main);
      border-color: var(--cyan);
    }

    .job-meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      font-size: 12px;
    }
    .meta-card {
      background-color: rgba(30, 41, 59, 0.4);
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-subtle);
    }
    .meta-label {
      color: var(--text-dim);
      margin-bottom: 3px;
      font-size: 11px;
      text-transform: uppercase;
    }
    .meta-value {
      font-family: var(--font-mono);
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 视图切换选项卡 */
    .tabs-bar {
      display: flex;
      border-bottom: 1px solid var(--border-subtle);
      padding: 0 28px;
      background-color: var(--bg-surface);
    }
    .tab-btn {
      padding: 12px 18px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tab-btn:hover { color: var(--text-main); }
    .tab-btn.active {
      color: var(--cyan);
      border-bottom-color: var(--cyan);
    }
    .tab-badge {
      font-size: 11px;
      background: var(--cyan-dim);
      color: var(--cyan);
      padding: 1px 6px;
      border-radius: 10px;
    }

    /* 子代理卡片矩阵 */
    .content-area {
      padding: 24px 28px;
      flex: 1;
    }
    .section-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .subagent-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }
    .subagent-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 16px;
      transition: all 0.2s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .subagent-card:hover {
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }
    .subagent-card.selected {
      border-color: var(--cyan);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.2);
      background-color: #17243b;
    }
    .subagent-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .subagent-role {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .subagent-action-box {
      background-color: var(--bg-base);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 12px;
      font-family: var(--font-mono);
      min-height: 52px;
      display: block;
      color: #e2e8f0;
      line-height: 1.6;
      word-break: break-word;
    }
    .tool-tag {
      background: rgba(14, 165, 233, 0.2);
      color: #38bdf8;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 700;
      margin-right: 8px;
      border: 1px solid rgba(14, 165, 233, 0.4);
      display: inline-block;
      white-space: nowrap;
      word-break: keep-all;
      vertical-align: baseline;
    }
    .subagent-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-dim);
      font-family: var(--font-mono);
    }

    /* 阶段产出与交付成果面板 */
    .result-panel {
      background-color: var(--bg-card);
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-radius: 10px;
      padding: 16px 18px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }
    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .result-badge {
      font-size: 11px;
      font-weight: 700;
      color: #34d399;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 2px 8px;
      border-radius: 12px;
    }
    .result-body {
      background: #05080f;
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 12px 14px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: #cbd5e1;
      line-height: 1.6;
      max-height: 280px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* 微观活动流抽屉/面板 */
    .timeline-panel {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 18px;
      margin-top: 16px;
      max-height: 420px;
      display: flex;
      flex-direction: column;
    }
    .timeline-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }
    .timeline-list {
      list-style: none;
      position: relative;
      padding-left: 20px;
      overflow-y: auto;
      flex: 1;
      padding-right: 8px;
    }
    .timeline-list::before {
      content: "";
      position: absolute;
      left: 6px;
      top: 4px;
      bottom: 4px;
      width: 2px;
      background: var(--border-subtle);
    }
    .timeline-item {
      position: relative;
      margin-bottom: 12px;
      font-size: 12px;
      font-family: var(--font-mono);
      color: var(--text-muted);
      line-height: 1.5;
    }
    .timeline-item::before {
      content: "";
      position: absolute;
      left: -18px;
      top: 5px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 6px var(--cyan);
    }

    /* 物理日志视图 */
    .log-viewer {
      background-color: #05080f;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 16px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: #94a3b8;
      height: 480px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.6;
    }

    /* 滚动条 */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
  </style>
</head>
<body>
  <!-- 顶栏 -->
  <header>
    <div class="brand">
      <div class="brand-logo">AG</div>
      <div class="brand-title">Antigravity Subagent Monitor</div>
      <div class="brand-badge">v1.3.0</div>
    </div>
    <div class="header-status">
      <div id="liveBadge" class="live-indicator">
        <div class="live-dot"></div>
        <span id="liveText">LIVE STREAMING</span>
      </div>
      <span id="jobStats" style="color: var(--text-dim); font-size: 12px; font-family: var(--font-mono);"></span>
      <button class="btn btn-secondary" onclick="fetchJobs()">手动刷新</button>
    </div>
  </header>

  <!-- 主体容器 -->
  <div class="app-container">
    <!-- 左侧任务导航 -->
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">任务历史 / 队列</div>
        <span id="taskCountBadge" style="font-size: 11px; font-family: var(--font-mono); color: var(--text-dim);">0 个任务</span>
      </div>
      <div id="taskList" class="task-list">
        <div style="padding: 20px; text-align: center; color: var(--text-dim); font-size: 12px;">加载中...</div>
      </div>
    </div>

    <!-- 右侧监控中央工作台 -->
    <div class="main-panel" id="mainPanel">
      <div class="empty-state" id="emptyState">
        <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" style="color: var(--text-dim);">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"></path>
        </svg>
        <div>请从左侧列表选择一个任务查看全员子代理工作流</div>
      </div>

      <!-- 任务详情容器（选中后渲染） -->
      <div id="jobDetailContainer" style="display: none;">
        <!-- Banner 元信息 -->
        <div class="job-banner">
          <div class="job-title-row">
            <div class="job-prompt" id="bannerPrompt"></div>
            <div class="job-actions">
              <button id="cancelBtn" class="btn btn-danger" onclick="cancelCurrentJob()">终止此任务</button>
            </div>
          </div>
          <div class="job-meta-grid">
            <div class="meta-card">
              <div class="meta-label">Task ID</div>
              <div class="meta-value" id="metaJobId"></div>
            </div>
            <div class="meta-card">
              <div class="meta-label">执行模型</div>
              <div class="meta-value" id="metaModel"></div>
            </div>
            <div class="meta-card">
              <div class="meta-label">工作区目录</div>
              <div class="meta-value" id="metaCwd"></div>
            </div>
            <div class="meta-card">
              <div class="meta-label">当前阶段 / 步数</div>
              <div class="meta-value" id="metaPhase"></div>
            </div>
          </div>
        </div>

        <!-- 标签页导航 -->
        <div class="tabs-bar">
          <button class="tab-btn active" id="tabSubagentsBtn" onclick="switchTab('subagents')">
            全员子代理微观视图
            <span class="tab-badge" id="subagentCountBadge">0</span>
          </button>
          <button class="tab-btn" id="tabLogsBtn" onclick="switchTab('logs')">
            物理诊断日志流
          </button>
        </div>

        <!-- 标签页内容区域 -->
        <div class="content-area">
          <!-- 子代理视图 -->
          <div id="viewSubagents">
            <!-- 阶段产出与交付成果面板 -->
            <div class="result-panel" id="resultPanel" style="display: none;">
              <div class="result-header">
                <div style="font-size: 13px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px;">
                  <span style="display:inline-block; width:8px; height:8px; background:#10b981; border-radius:50%;"></span>
                  任务执行成果与阶段交付物
                </div>
                <span class="result-badge" id="resultBadge">已就绪</span>
              </div>
              <div class="result-body" id="resultContent"></div>
            </div>

            <div class="section-title">
              <span style="display:inline-block; width:8px; height:8px; background:var(--cyan); border-radius:50%;"></span>
              Teamwork 协同架构与代理矩阵
            </div>
            <div class="subagent-grid" id="subagentGrid"></div>

            <!-- 微观执行活动时间线 -->
            <div class="timeline-panel" id="timelinePanel">
              <div class="timeline-header">
                <div style="font-size: 13px; font-weight: 700; color: #fff;" id="timelineTitle">微观活动流水</div>
                <span style="font-size: 11px; font-family: var(--font-mono); color: var(--text-dim);" id="timelineConvId"></span>
              </div>
              <ul class="timeline-list" id="timelineList"></ul>
            </div>
          </div>

          <!-- 物理日志视图 -->
          <div id="viewLogs" style="display: none;">
            <div class="section-title">原生运行日志流 (Tail)</div>
            <div class="log-viewer" id="logViewer"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentJobs = [];
    let selectedJobId = null;
    let selectedSubagentIndex = null;
    let currentTab = "subagents";

    // 工具调用高亮格式化
    function formatActionHtml(actionText) {
      if (!actionText) return '<span style="color: var(--text-dim);">等待工具响应...</span>';
      return actionText.replace(/\[(\w+)\]/g, '<span class="tool-tag">[$1]</span>');
    }

    // 状态样式标签
    function renderStatusTag(state) {
      const cls = `status-${state || "unknown"}`;
      const labels = {
        running: "运行中",
        queued: "排队中",
        success: "已完成",
        completed: "已交付",
        cancelled: "已取消",
        interrupted: "已中断",
        error: "异常",
      };
      const label = labels[state] || state;
      return `<span class="status-tag ${cls}">${label}</span>`;
    }

    // 切换左侧选中任务
    function selectJob(jobId) {
      selectedJobId = jobId;
      selectedSubagentIndex = null;
      renderTaskList();
      renderJobDetail();
    }

    // 切换选项卡
    function switchTab(tab) {
      currentTab = tab;
      document.getElementById("tabSubagentsBtn").className = tab === "subagents" ? "tab-btn active" : "tab-btn";
      document.getElementById("tabLogsBtn").className = tab === "logs" ? "tab-btn active" : "tab-btn";
      document.getElementById("viewSubagents").style.display = tab === "subagents" ? "block" : "none";
      document.getElementById("viewLogs").style.display = tab === "logs" ? "block" : "none";
    }

    // 渲染左侧任务列表
    function renderTaskList() {
      const container = document.getElementById("taskList");
      document.getElementById("taskCountBadge").innerText = `${currentJobs.length} 个任务`;
      if (currentJobs.length === 0) {
        container.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-dim); font-size: 12px;">暂无任务记录</div>';
        return;
      }

      container.innerHTML = currentJobs.map((job) => {
        const isSelected = job.jobId === selectedJobId;
        const shortPrompt = (job.invocation.prompt || job.invocation.slash_command || "未命名任务").slice(0, 80);
        const subCount = job.progress?.subagents?.length || 0;
        const timeStr = job.startedAt ? new Date(job.startedAt).toLocaleTimeString() : "";

        return `
          <div class="task-item ${isSelected ? "active" : ""}" onclick="selectJob('${job.jobId}')">
            <div class="task-meta">
              ${renderStatusTag(job.state)}
              <span style="color: var(--text-dim); font-family: var(--font-mono); font-size: 11px;">${timeStr}</span>
            </div>
            <div class="task-prompt-preview">${escapeHtml(shortPrompt)}</div>
            <div class="task-sub-info">
              <span>Step ${job.progress.current_step || 0}</span>
              <span>${subCount > 0 ? `${subCount} 个子代理` : "单代理模式"}</span>
            </div>
          </div>
        `;
      }).join("");
    }

    // 渲染右侧任务详情
    function renderJobDetail() {
      const emptyState = document.getElementById("emptyState");
      const container = document.getElementById("jobDetailContainer");
      const job = currentJobs.find((j) => j.jobId === selectedJobId);

      if (!job) {
        emptyState.style.display = "flex";
        container.style.display = "none";
        return;
      }

      emptyState.style.display = "none";
      container.style.display = "block";

      // 填入头部数据
      document.getElementById("bannerPrompt").innerText = job.invocation.prompt || job.invocation.slash_command || "未命名任务";
      document.getElementById("metaJobId").innerText = job.jobId;
      document.getElementById("metaModel").innerText = job.invocation.model || "默认模型";
      document.getElementById("metaCwd").innerText = job.invocation.cwd || "-";
      document.getElementById("metaPhase").innerText = `${job.progress.phase} (Step ${job.progress.current_step || 0})`;

      const isRunning = ["running", "queued", "stopping", "retrying"].includes(job.state);
      const cancelBtn = document.getElementById("cancelBtn");
      cancelBtn.style.display = isRunning ? "inline-flex" : "none";

      // 阶段交付成果渲染
      const resultPanel = document.getElementById("resultPanel");
      const resultContent = document.getElementById("resultContent");
      const resultBadge = document.getElementById("resultBadge");
      const responseText = job.result?.response || (job.result?.status === "ERROR" ? (job.result.error || "任务执行异常") : "");
      if (responseText) {
        resultPanel.style.display = "flex";
        resultBadge.innerText = job.state === "success" ? "已交付" : (job.state === "error" ? "异常中断" : "阶段就绪");
        resultBadge.style.color = job.state === "error" ? "#f87171" : "#34d399";
        resultContent.innerText = responseText;
      } else {
        resultPanel.style.display = "none";
      }

      // 代理矩阵网格（主编排器卡片 + 子代理卡片）
      const subagents = job.progress.subagents || [];
      document.getElementById("subagentCountBadge").innerText = subagents.length > 0 ? `${subagents.length} 个子代理` : "主编排器推进";
      const grid = document.getElementById("subagentGrid");

      // 始终在网格最前置渲染主编排器卡片
      const isLeadSelected = selectedSubagentIndex === null;
      let gridHtml = `
        <div class="subagent-card ${isLeadSelected ? "selected" : ""}" onclick="selectSubagent(null)" style="border-color: ${isLeadSelected ? "var(--cyan)" : "rgba(14,165,233,0.3)"};">
          <div class="subagent-card-header">
            <div class="subagent-role" style="color: var(--cyan);">
              <span style="display:inline-block; width:6px; height:6px; background:var(--cyan); border-radius:50%;"></span>
              Lead Orchestrator (项目主编排器)
            </div>
            ${renderStatusTag(job.state)}
          </div>
          <div class="subagent-action-box">
            ${formatActionHtml(job.progress.last_tool ? `[${job.progress.last_tool}] ${job.progress.current_action}` : job.progress.current_action)}
          </div>
          <div class="subagent-footer">
            <span>步数: Step ${job.progress.current_step || 0}</span>
            <span title="${job.conversationId || ""}">ID: ${(job.conversationId || job.jobId || "pending").slice(0, 8)}...</span>
          </div>
        </div>
      `;

      if (subagents.length === 0) {
        gridHtml += `
          <div style="padding: 16px 20px; background: var(--bg-card); border-radius: 8px; border: 1px dashed var(--border-subtle); color: var(--text-dim); display: flex; flex-direction: column; justify-content: center; font-size: 12px; line-height: 1.6;">
            <div>当前阶段由主编排器（Lead Orchestrator）推进。</div>
            <div style="color: var(--text-muted); font-size: 11px;">在委派多代理团队或派发专项 Worker 后，协同子代理卡片将在此网格动态追加。</div>
          </div>
        `;
      } else {
        gridHtml += subagents.map((sub, idx) => {
          const isCardSelected = selectedSubagentIndex === idx;
          return `
            <div class="subagent-card ${isCardSelected ? "selected" : ""}" onclick="selectSubagent(${idx})">
              <div class="subagent-card-header">
                <div class="subagent-role">
                  <span style="display:inline-block; width:6px; height:6px; background:var(--cyan); border-radius:50%;"></span>
                  ${escapeHtml(sub.role || "Subagent")}
                </div>
                ${renderStatusTag(sub.status)}
              </div>
              <div class="subagent-action-box">
                ${formatActionHtml(sub.current_action)}
              </div>
              <div class="subagent-footer">
                <span>步数: Step ${sub.step || 0}</span>
                <span title="${sub.conversation_id || ""}">ID: ${(sub.conversation_id || "pending").slice(0, 8)}...</span>
              </div>
            </div>
          `;
        }).join("");
      }
      grid.innerHTML = gridHtml;

      // 渲染微观时间线
      renderTimeline(job, subagents);

      // 日志渲染
      const logViewer = document.getElementById("logViewer");
      logViewer.innerText = job.logTail || "(暂无日志输出或日志文件为空)";
    }

    // 选中某个子代理展开微观流水（传入 null 则选回主编排器）
    function selectSubagent(index) {
      selectedSubagentIndex = index;
      renderJobDetail();
    }

    // 渲染微观时间线
    function renderTimeline(job, subagents) {
      const panel = document.getElementById("timelinePanel");
      panel.style.display = "flex";

      const isLead = selectedSubagentIndex === null;
      let title = "";
      let convId = "";
      let acts = [];

      if (isLead) {
        title = "Lead Orchestrator (主编排器) 微观活动流水";
        convId = `会话 ID: ${job.conversationId || job.jobId || "主会话"}`;
        acts = job.progress.recent_activities || [];
      } else {
        const sub = subagents[selectedSubagentIndex];
        if (sub) {
          title = `${sub.role} 微观执行流水`;
          convId = `会话 ID: ${sub.conversation_id || "未知"}`;
          acts = sub.recent_activities || [];
        }
      }

      document.getElementById("timelineTitle").innerText = title;
      document.getElementById("timelineConvId").innerText = convId;

      const list = document.getElementById("timelineList");
      if (!acts || acts.length === 0) {
        list.innerHTML = '<li class="timeline-item">暂无微观步骤记录</li>';
      } else {
        list.innerHTML = acts.map((act) => `<li class="timeline-item">${formatActionHtml(act)}</li>`).join("");
      }
    }

    // 取消任务
    async function cancelCurrentJob() {
      if (!selectedJobId) return;
      if (!confirm(`确定要终止任务 ${selectedJobId} 吗？`)) return;
      try {
        const resp = await fetch(`/api/jobs/${selectedJobId}/cancel`, { method: "POST" });
        const data = await resp.json();
        alert(data.message || "已请求取消");
        fetchJobs();
      } catch (err) {
        alert("取消失败：" + err.message);
      }
    }

    // 获取数据
    async function fetchJobs() {
      try {
        const resp = await fetch("/api/jobs");
        currentJobs = await resp.json();
        if (!selectedJobId && currentJobs.length > 0) {
          selectedJobId = currentJobs[0].jobId;
        }
        renderTaskList();
        renderJobDetail();
      } catch (err) {
        console.error("加载任务失败：", err);
      }
    }

    // 初始化 SSE 连接
    function initSSE() {
      const evtSource = new EventSource("/api/stream");
      const badge = document.getElementById("liveBadge");
      const text = document.getElementById("liveText");

      evtSource.addEventListener("snapshot", (e) => {
        try {
          currentJobs = JSON.parse(e.data);
          if (!selectedJobId && currentJobs.length > 0) {
            selectedJobId = currentJobs[0].jobId;
          }
          renderTaskList();
          renderJobDetail();
        } catch {}
      });

      evtSource.onopen = () => {
        badge.className = "live-indicator";
        text.innerText = "LIVE STREAMING";
      };

      evtSource.onerror = () => {
        badge.className = "live-indicator";
        badge.style.borderColor = "var(--red)";
        badge.style.color = "var(--red)";
        text.innerText = "RECONNECTING...";
      };
    }

    function escapeHtml(str) {
      if (!str) return "";
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // 启动初始拉取与 SSE
    fetchJobs();
    initSSE();
  </script>
</body>
</html>
